<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vibe Prompt Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page-container">

    <!-- Top Navigation Header (Without Upload Button) -->
    <div class="brand-nav">
      <div class="brand-logo-text">Vibe Prompt</div>
    </div>

    <!-- MAIN EXPLORE PAGE -->
    <div id="page-explore" class="page active-page">
      <div class="hero-banner">
        <h1 class="hero-title">Prompt Space</h1>
        <p class="hero-subtitle">Access high-quality AI prompts effortlessly</p>
        <p class="hero-tags">
          <span class="tag-mj">Midjourney</span> • 
          <span class="tag-chat">ChatGPT</span> • 
          <span class="tag-claude">Claude</span> • 
          <span class="tag-gemini">Gemini</span>
        </p>

        <div class="search-wrapper">
          <input type="text" id="searchInput" class="search-bar" placeholder="Search prompts..." oninput="renderGrid()">
          <button class="search-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          </button>
        </div>
      </div>

      <div class="section-title">Featured Prompts</div>
      <div class="grid-1col" id="explore-grid"></div>
    </div>

    <!-- FULL DETAIL VIEW -->
    <div id="full-detail-page" class="full-detail-view">
      <button class="back-btn" onclick="closeFullPage()">← Back to Prompts</button>
      <div class="detail-media-container" id="fullMediaBox" style="display: none;"></div>
      <div class="full-prompt-box">
        <div class="card-head">
          <h2 id="fullTitle" style="color: #fff; font-size: 1.2rem;"></h2>
          <span class="tag" id="fullTag">AI</span>
        </div>
        <div class="full-prompt-text" id="fullPromptText"></div>
        <button class="copy-btn" id="fullCopyBtn" style="padding: 14px; font-size: 0.9rem;">Copy Prompt</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
